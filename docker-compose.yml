services:
  translator:
    build:
      context: .
      args:
        JOBS: 1
    privileged: true
    restart: always
    environment:
      - CONFIG_PATH=/app/config/config.json
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - /dev:/dev
      - /run/udev:/run/udev:ro
    devices:
      - /dev/i2c-1
      - /dev/snd
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
