services:
  translator:
    build:
      context: .
      args:
        JOBS: 1
    privileged: true
    restart: unless-stopped
    environment:
      - CONFIG_PATH=/app/config/config.json
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8080
      - PYTHONUNBUFFERED=1
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - /dev:/dev
      - /run/udev:/run/udev:ro
    devices:
      - /dev/i2c-1
      - /dev/snd
      - /dev/gpiomem
    group_add:
      - gpio
      - i2c
      - audio
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://localhost:8080/api/health'); assert r.status == 200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
